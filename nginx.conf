server {
        listen 443 ssl;

        server_name energet.shop;

        ssl_certificate /etc/letsencrypt/live/energet.shop/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/energet.shop/privkey.pem;

        root /var/www/dist;

        index index.html index.htm index.nginx-debian.html;

        location / {
                try_files $uri $uri/ /index.html;
        }

        location /api/ {
                proxy_pass http://api:8000;
        }

        location /images/ {
                proxy_pass http://minio:9000;
        }
}
